{% extends "usuarios/base_auth.html" %}

{% block titulo %}Cuenta creada{% endblock %}

{% block contenido %}
        <div class="success-icon">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
        </div>

        <h2 class="auth-card__title">¡Cuenta creada con éxito!</h2>
        <p class="auth-card__subtitle">Bienvenido, {{ nombre }}. Tu cuenta de usuario con el correo <strong>{{ correo }}</strong> ya está lista.</p>

        <div class="auth-card__actions">
          <a class="btn btn--primary btn--block" href="{% url 'login' %}">Ir al inicio de sesión</a>
        </div>
{% endblock %}
