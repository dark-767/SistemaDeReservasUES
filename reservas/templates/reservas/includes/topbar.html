<header class="topbar">
  <a class="brand" href="{% url 'inicio' %}">
    <span class="brand__mark">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
        stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="4" width="18" height="18" rx="2" />
        <path d="M16 2v4M8 2v4M3 10h18" />
      </svg>
    </span>
    ReservaEspacios
  </a>
<nav class="nav" aria-label="Principal">
      <a href="{% url 'buscar_disponibilidad' %}"{% if nav_activa == "buscar" %} class="is-active" aria-current="page"{% endif %}>Buscar espacios</a>
      {% if es_admin %}
      <a href="{% url 'solicitudes' %}"{% if nav_activa == "solicitudes" %} class="is-active" aria-current="page"{% endif %}>Solicitudes</a>
      {% endif %}
      <a href="{% url 'mis_solicitudes' %}"{% if nav_activa == "mis_solicitudes" %} class="is-active" aria-current="page"{% endif %}>Mis solicitudes</a>
      <a href="{% url 'calendario' %}"{% if nav_activa == "calendario" %} class="is-active" aria-current="page"{% endif %}>Calendario</a>
    </nav>
  <div class="user">
    <span class="avatar" aria-hidden="true">{{ iniciales }}</span>
    <div class="user__info">
      <span class="user__name">{{ nombre_usuario }}</span>
      <span class="user__role">{{ rol_usuario }}</span>
    </div>
    <form method="post" action="{% url 'salir' %}">
      {% csrf_token %}
      <button class="btn btn--ghost" type="submit" title="Cerrar sesión">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round" aria-hidden="true">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
          <path d="m16 17 5-5-5-5M21 12H9" />
        </svg>
        <span class="hide-sm">Salir</span>
      </button>
    </form>
  </div>
</header>
